<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Language Translator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="desk">
    <header class="masthead">
      <h1>Language Translator</h1>
      <p>Type or paste text, choose the languages, and read the translation beside it.</p>
    </header>

    <section class="spread" aria-label="Translator">
      <div class="page page-source">
        <div class="page-head">
          <div class="select-wrap">
            <label class="visually-hidden" for="source-lang">Translate from</label>
            <select id="source-lang" class="lang-select">
              <option value="auto" selected>Detect language</option>
              {% for lang in languages %}
              <option value="{{ lang.code }}">{{ lang.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <textarea id="source-text" class="field" dir="auto" maxlength="{{ max_chars }}"
                  placeholder="Type or paste text here" spellcheck="false" autofocus></textarea>
        <div class="page-foot">
          <span id="char-count" class="meter">0 / {{ max_chars }}</span>
          <button type="button" id="clear-btn" class="text-btn">Clear</button>
        </div>
      </div>

      <div class="spine">
        <button type="button" id="swap-btn" class="swap" aria-label="Swap languages" title="Swap languages">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path d="M7 7h11m0 0-3-3m3 3-3 3M17 17H6m0 0 3-3m-3 3 3 3" fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="page page-target">
        <div class="page-head">
          <div class="select-wrap">
            <label class="visually-hidden" for="target-lang">Translate to</label>
            <select id="target-lang" class="lang-select">
              {% for lang in languages %}
              <option value="{{ lang.code }}"{% if lang.code == default_target %} selected{% endif %}>{{ lang.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div id="output" class="field output" dir="auto" data-empty="true"
             data-placeholder="The translation appears here"></div>
        <div class="page-foot">
          <button type="button" id="copy-btn" class="text-btn" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <path d="M5 15V6a2 2 0 0 1 2-2h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span class="label">Copy</span>
          </button>
          <button type="button" id="speak-btn" class="text-btn" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <path d="M4 9v6h4l5 4V5L8 9H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span class="label">Listen</span>
          </button>
        </div>
      </div>
    </section>

    <div class="actions">
      <button type="button" id="translate-btn" class="primary">Translate</button>
      <span class="hint"><span id="shortcut-hint">Ctrl + Enter</span> also translates</span>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
